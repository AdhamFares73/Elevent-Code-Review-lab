<h2>A password, refreshed.</h2>
<p class="auth-intro">Choose something new for your Morrow account.</p>

<form [formGroup]="passwordForm" (ngSubmit)="submit()" [attr.aria-busy]="loading()" novalidate>
  <app-input-form
    labelName="New password"
    type="password"
    forId="reset-password"
    [errorMessage]="getErrorMessage('password')"
    formControlName="password"
  />

  <app-input-form
    labelName="Confirm Password"
    type="password"
    forId="register-confirm"
    formControlName="confirmPassword"
    [errorMessage]="confirmPasswordError"
  />

  @if (error()) {
    <p class="auth-request-error" role="alert">{{ error() }}</p>
  }

  <app-button
    [value]="loading() ? 'Finishing up…' : 'Reset password'"
    type="submit"
    [isDisabled]="passwordForm.invalid || loading()"
  />
</form>

<button class="auth-back" type="button" [disabled]="loading()" (click)="backClicked.emit()">
  ← Back to verification
</button>
